<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b101c" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Document Sheet Graphic -->
  <g transform="translate(106, 96)">
    <!-- Sheet background with subtle shadow -->
    <rect x="0" y="0" width="300" height="340" rx="28" fill="url(#sheetGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="3" />
    
    <!-- Header accent line -->
    <rect x="36" y="44" width="120" height="18" rx="9" fill="url(#accentGrad)" />

    <!-- Bullet Item 1 -->
    <circle cx="48" cy="106" r="8" fill="#6366f1" />
    <rect x="72" y="98" width="180" height="14" rx="7" fill="rgba(255,255,255,0.7)" />

    <!-- Bullet Item 2 -->
    <circle cx="48" cy="154" r="8" fill="#38bdf8" />
    <rect x="72" y="146" width="150" height="14" rx="7" fill="rgba(255,255,255,0.7)" />

    <!-- Bullet Item 3 -->
    <circle cx="48" cy="202" r="8" fill="#10b981" />
    <rect x="72" y="194" width="190" height="14" rx="7" fill="rgba(255,255,255,0.7)" />

    <!-- Subtle bottom metric badge -->
    <rect x="36" y="252" width="228" height="42" rx="12" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="2" />
    <circle cx="62" cy="273" r="7" fill="#10b981" />
    <rect x="82" y="266" width="120" height="12" rx="6" fill="#67e8f9" />
  </g>

  <!-- Large Floating AI Sparkle Badge -->
  <g transform="translate(330, 70)" filter="url(#glow)">
    <circle cx="45" cy="45" r="45" fill="url(#accentGrad)" />
    <!-- 4-point Sparkle Star -->
    <path d="M45 15 C45 32 32 45 15 45 C32 45 45 58 45 75 C45 58 58 45 75 45 C58 45 45 32 45 15 Z" fill="#ffffff" />
  </g>
</svg>
